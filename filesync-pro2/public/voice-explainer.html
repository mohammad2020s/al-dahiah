<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>صوت فيديو الشرح - الداهية</title>
<style>
  :root { --brand:#a5492a; --ink:#3f2a22; --muted:#6f5446; --line:#e2d5c6; --bg:#f1e7da; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.7 system-ui, "Segoe UI", Tahoma, sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:24px; margin:0 0 6px; color:var(--brand); }
  p { margin:6px 0; color:var(--muted); }
  button, a.btn { display:block; width:100%; margin-top:14px; padding:16px; border:0; border-radius:16px; background:var(--brand); color:#fff; font:inherit; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
  button:disabled { opacity:.6; }
  .ghost { background:#fff; color:var(--brand); border:1.5px solid var(--brand); }
  #log { margin-top:16px; padding:12px 14px; border-radius:14px; background:#fffdf9; border:1px solid var(--line); font-size:15px; white-space:pre-line; min-height:3em; }
  audio { width:100%; margin-top:16px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>صوت فيديو شرح الموقع</h1>
  <p>اضغط «سجّل الصوت»، وانتظر لين يجهز (تقريباً دقيقة). بعدها اسمعه، واضغط «احفظ الصوت»، وأرسل الملف في المحادثة مع Claude.</p>
  <button id="go">سجّل الصوت</button>
  <div id="log">جاهز.</div>
  <audio id="player" controls class="hidden"></audio>
  <button id="share" class="hidden">احفظ الصوت / أرسله</button>
  <a id="dl" class="btn ghost hidden" download="explainer-voice.wav">نزّل الملف</a>
</div>
<script>
// The explainer video's narration, in two takes (the voice keeps one tone within a take), read with
// the site's own voice in the "classic" style (the first ad's tone; town name «الَقْصَبْ»).
const PARTS = [
  "يا هلا! أنا الداهية، دليلك الذكي في القصب وموسم ملح القصب.. خلني أوريك وش في موقعي. أول ما تدخل أرحب فيك، ولك تسمع ترحيبي بصوتي. اسألني أي شي: وش أسوي اليوم؟ وين المملحة؟ وأرد عليك بلهجتنا، ولك تسمع الرد بصوتي. وإذا تبي، اضغط: كلّم الداهية بصوتك، وسولف معي مثل أي مكالمة. صوّر أي مكان واسألني: وش هذا المكان؟ وأعلمك عنه. وكل يوم تلقى: الليلة في الموسم، فعاليات اليوم وأوقاتها من دليل الزائر الرسمي.",
  "وقريب مني يطلع لك أقرب مسجد ودورة مياه ومقهى، وخريطة الموسم توديك لأي مكان. واختم جواز الملح في ست معالم، وخذ شهادة مستكشف القصب. وفيه جولة مرتبة ليومك، والطقس، وأوقات الصلاة، والتذكرة. شارك لقطتك من الموسم، وقل رأيك في الاستبيان، وأرسلني لأهلك في الواتساب. والموقع بالعربي والإنجليزي، وفيه وضع ليلي. كله مجاني وبدون تحميل تطبيق: الداهية دوت كوم. وش تنتظر؟"
];
const $ = (id) => document.getElementById(id);
const log = (t) => { $("log").textContent = t; };
function pcmOf(bytes) {
  const dv = new DataView(bytes.buffer);
  if (String.fromCharCode(...bytes.slice(0, 4)) !== "RIFF") return bytes;
  let p = 12;
  while (p < bytes.length - 8) {
    const id = String.fromCharCode(...bytes.slice(p, p + 4)), sz = dv.getUint32(p + 4, true);
    if (id === "data") return bytes.slice(p + 8, p + 8 + sz);
    p += 8 + sz + (sz & 1);
  }
  return new Uint8Array(0);
}
async function take(text, n) {
  const chars = text.replace(/\s/g, "").length;
  for (let tryNo = 1; tryNo <= 4; tryNo++) {
    log(`أسجّل الجزء ${n} من ${PARTS.length}… (محاولة ${tryNo})`);
    const r = await fetch("/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, language: "ar", style: "classic" }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.audio) { log(j.error || "صار خطأ، أحاول مرة ثانية…"); await new Promise((res) => setTimeout(res, 4000)); continue; }
    const pcm = pcmOf(Uint8Array.from(atob(j.audio), (c) => c.charCodeAt(0)));
    const secs = pcm.length / 48000;
    // a take far longer than the text needs usually read extra words: try again
    if (secs > chars / 6.5 && tryNo < 4) continue;
    return pcm;
  }
  throw new Error("ما قدرت أسجّل هذا الجزء، جرّب بعد شوي.");
}
$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    const parts = [];
    for (let i = 0; i < PARTS.length; i++) parts.push(await take(PARTS[i], i + 1));
    const gap = new Uint8Array(Math.round(24000 * 0.5) * 2);
    const chunks = parts.flatMap((p, i) => (i ? [gap, p] : [p]));
    const total = chunks.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(44 + total), d = new DataView(out.buffer);
    const w = (o, s) => [...s].forEach((c, i) => (out[o + i] = c.charCodeAt(0)));
    w(0, "RIFF"); d.setUint32(4, 36 + total, true); w(8, "WAVE"); w(12, "fmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
    d.setUint32(24, 24000, true); d.setUint32(28, 48000, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, total, true);
    let o = 44; for (const c of chunks) { out.set(c, o); o += c.length; }
    const blob = new Blob([out], { type: "audio/wav" });
    const url = URL.createObjectURL(blob);
    $("player").src = url; $("player").classList.remove("hidden");
    $("dl").href = url; $("dl").classList.remove("hidden");
    const file = new File([blob], "explainer-voice.wav", { type: "audio/wav" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      $("share").classList.remove("hidden");
      $("share").onclick = () => navigator.share({ files: [file], title: "صوت فيديو الشرح" }).catch(() => {});
    }
    log(`جاهز! طوله ${Math.round(total / 48000)} ثانية. اسمعه، وبعدها احفظه وأرسله في المحادثة.`);
  } catch (e) {
    log(String(e.message || e));
  }
  $("go").disabled = false; $("go").textContent = "سجّل من جديد";
};
</script>
</body>
</html>
