<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Dahya - Real-time 2D Lip-Syncing Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. CSS STYLING: Dark Red/Charcoal Al-Dahya Theme with Glowing Avatar
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #350f0c 0%, #170403 100%);
      color: #fef5f4;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #fff;
    }

    p.subtitle {
      font-size: 14px;
      color: #e0b8b6;
      margin-bottom: 30px;
    }

    /* --------------------------------------------------------------------------
       Avatar Container & Pulsing Back Glow
       -------------------------------------------------------------------------- */
    .avatar-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    /* Soft glowing circle behind the avatar that pulses dynamically with voice volume */
    .avatar-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.6) 0%, rgba(245, 158, 11, 0.4) 50%, rgba(184, 46, 36, 0) 70%);
      filter: blur(28px);
      pointer-events: none;
      transform: scale(1);
      transition: transform 0.08s ease-out, opacity 0.08s ease-out;
      opacity: 0.4;
      z-index: 1;
    }

    /* --------------------------------------------------------------------------
       Circular framing mask with Fixed Dimensions
       -------------------------------------------------------------------------- */
    .avatar-frame {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(251, 113, 133, 0.5);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      background-color: #222222;
      z-index: 2;
      transform: scale(1);
      transition: transform 0.08s ease-out, border-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Active speech state border glow */
    .avatar-frame.speaking {
      border-color: #fb7185;
      box-shadow: 0 0 30px rgba(251, 113, 133, 0.6), 0 15px 40px rgba(0, 0, 0, 0.8);
    }

    /* Fixed-size wrapper guaranteeing zero layout shift */
    .avatar-image-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /*
      The Avatar Image - statically anchored with absolute positioning,
      fixed width/height, object-fit: contain, and object-position: center
      so the face never shifts, jumps, or moves across all 4 mouth states.
    */
    #avatar-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform: scale(1.18) translateZ(0); /* Hardware acceleration & seamless mask filling */
    }

    /* Live Volume Meter Bar */
    .meter-container {
      width: 240px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      border-radius: 999px;
      transition: width 0.05s ease-out;
    }

    .state-indicator {
      font-size: 13px;
      font-weight: bold;
      color: #fca5a5;
      margin-bottom: 24px;
      height: 20px;
    }

    /* Controls & Audio Test Buttons */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Cairo', system-ui, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mic {
      background: #b82e24;
      color: #fff;
      box-shadow: 0 4px 15px rgba(184, 46, 36, 0.4);
    }

    .btn-mic:hover {
      background: #992017;
      transform: translateY(-1px);
    }

    .btn-synth {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .btn-synth:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>مساعد الداهية الصوتي - Al-Dahya</h1>
    <p class="subtitle">نظام مزامنة الشفاه ثنائي الأبعاد المباشر (Real-time 2D Lip-Sync)</p>

    <!-- Avatar Display -->
    <div class="avatar-wrapper">
      <div id="avatar-glow" class="avatar-glow"></div>
      <div id="avatar-frame" class="avatar-frame">
        <div class="avatar-image-container">
          <!-- 
            The main image element statically anchored with object-fit: contain; object-position: center
            so all 4 mouth states align with 0px shift.
          -->
          <img id="avatar-image" src="/avatar/mouth_closed.jpeg" alt="Al-Dahya Avatar">
        </div>
      </div>
    </div>

    <!-- Real-time Volume Meter -->
    <div class="meter-container">
      <div id="meter-fill" class="meter-fill"></div>
    </div>

    <div id="state-label" class="state-indicator">الحالة: سكون (فم مغلق)</div>

    <!-- Audio Input Buttons for Testing -->
    <div class="controls">
      <button id="btn-toggle-mic" class="btn-mic">🎙️ تشغيل الميكروفون المباشر</button>
      <button id="btn-test-speech" class="btn-synth">🔊 تجربة نطق صوتي اختباري</button>
    </div>
  </div>

  <!-- ==========================================================================
       2. JAVASCRIPT: Web Audio API (AnalyserNode) & Real-time Lip-Sync Engine
       ========================================================================== -->
  <script>
    /* ==========================================================================
       CONFIGURATION: STEP 1 - INSERT YOUR 4 IMAGE PATHS HERE
       ========================================================================== */
    const MOUTH_IMAGES = {
      // 1. Idle / Closed mouth (used during silence or volume below thresholdLow)
      closed: "/avatar/mouth_closed.jpeg",

      // 2. Half-open mouth (used for low-volume syllables and whispers)
      low: "/avatar/mouth_low.jpeg",

      // 3. Normal open mouth (used for standard conversational speech)
      medium: "/avatar/mouth_medium.jpeg",

      // 4. Wide-open mouth (used for loud vowels, emphasis, or exclamations)
      wide: "/avatar/mouth_wide.jpeg"
    };

    /* ==========================================================================
       CONFIGURATION: STEP 2 - TWEAK VOLUME THRESHOLDS (0.0 to 1.0)
       --------------------------------------------------------------------------
       * thresholdLow:    Below this value, avatar remains in 'closed' mouth state.
       * thresholdMedium: Between Low and Medium triggers 'half-open' mouth state.
       * thresholdWide:   Between Medium and Wide triggers 'normal open' mouth state.
                          Above Wide triggers 'wide-open' mouth state.
       * smoothingFactor: (0.1 - 0.5) Higher = faster reaction, Lower = smoother.
       ========================================================================== */
    const CONFIG = {
      thresholdLow: 0.08,     // Silence vs speaking boundary
      thresholdMedium: 0.22,  // Low volume vs normal speech
      thresholdWide: 0.45,    // Normal speech vs loud emphasis
      smoothingFactor: 0.32,  // Exponential moving average filter weight
      holdTimeMs: 40          // Min time (ms) to hold mouth state to avoid flicker
    };

    // Preload all 4 images into browser memory to eliminate image swap flickering
    Object.values(MOUTH_IMAGES).forEach(src => {
      const img = new Image();
      img.src = src;
    });

    // DOM Elements
    const avatarImg = document.getElementById("avatar-image");
    const avatarFrame = document.getElementById("avatar-frame");
    const avatarGlow = document.getElementById("avatar-glow");
    const meterFill = document.getElementById("meter-fill");
    const stateLabel = document.getElementById("state-label");
    const btnMic = document.getElementById("btn-toggle-mic");
    const btnTestSpeech = document.getElementById("btn-test-speech");

    // Audio Engine State Variables
    let audioContext = null;
    let analyserNode = null;
    let audioSourceNode = null;
    let micStream = null;
    let isListening = false;
    let animationFrameId = null;

    // Smoothed volume level & state debounce tracker
    let smoothedVolume = 0;
    let currentMouthState = "closed";
    let lastStateChangeTime = 0;

    /**
     * Initializes the Web Audio API AnalyserNode.
     * Can be fed with ANY live MediaStream (e.g. Gemini AI voice stream, AudioBufferSource, or Microphone).
     */
    function initAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
      }

      if (!analyserNode) {
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 512;               // Resolution for time-domain wave analysis
        analyserNode.smoothingTimeConstant = 0.4; // Internal hardware smoothing
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    /**
     * Connects an incoming live Audio Node or MediaStream to the AnalyserNode.
     * @param {AudioNode|MediaStream} streamOrNode 
     */
    function connectAudioSource(streamOrNode) {
      initAudioContext();

      if (audioSourceNode) {
        try { audioSourceNode.disconnect(); } catch (e) {}
      }

      if (streamOrNode instanceof MediaStream) {
        audioSourceNode = audioContext.createMediaStreamSource(streamOrNode);
        // Connect to analyser (do not connect mic to destination to avoid acoustic echo)
        audioSourceNode.connect(analyserNode);
      } else if (streamOrNode instanceof AudioNode) {
        audioSourceNode = streamOrNode;
        // For AI voice playback: route source through analyser, then to speakers
        audioSourceNode.connect(analyserNode);
        analyserNode.connect(audioContext.destination);
      }

      // Start the real-time requestAnimationFrame analysis loop
      if (!animationFrameId) {
        startAnalysisLoop();
      }
    }

    /**
     * Real-time Analysis Loop (Runs at 60 FPS via requestAnimationFrame).
     * Calculates RMS volume and dynamically swaps the <img> src attribute.
     */
    function startAnalysisLoop() {
      const bufferLength = analyserNode.fftSize;
      const dataArray = new Uint8Array(bufferLength);

      function loop() {
        // 1. Extract real-time waveform byte data (range: 0 to 255, centered at 128)
        analyserNode.getByteTimeDomainData(dataArray);

        // 2. Compute Root Mean Square (RMS) volume
        let sumSquares = 0;
        for (let i = 0; i < bufferLength; i++) {
          const normalized = (dataArray[i] - 128) / 128; // Normalize to -1.0 .. +1.0
          sumSquares += normalized * normalized;
        }
        const rms = Math.sqrt(sumSquares / bufferLength);

        // 3. Normalize & scale RMS into instantVolume (0.0 to 1.0)
        const instantVolume = Math.min(1.0, rms * 4.5);

        // 4. Apply Exponential Moving Average (EMA) smoothing filter to prevent jitter
        smoothedVolume += (instantVolume - smoothedVolume) * CONFIG.smoothingFactor;
        const vol = smoothedVolume;

        // 5. Update UI Volume Meter Bar
        meterFill.style.width = `${Math.min(100, Math.round(vol * 100))}%`;

        // 6. Evaluate Volume against Thresholds to Select Target Mouth State
        let targetState = "closed";
        let targetSrc = MOUTH_IMAGES.closed;
        let labelText = "الحالة: سكون (فم مغلق)";

        if (vol >= CONFIG.thresholdWide) {
          targetState = "wide";
          targetSrc = MOUTH_IMAGES.wide;
          labelText = "الحالة: فم مفتوح بالكامل (نبرة عالية)";
        } else if (vol >= CONFIG.thresholdMedium) {
          targetState = "medium";
          targetSrc = MOUTH_IMAGES.medium;
          labelText = "الحالة: فم مفتوح عادي (تحدث منتظم)";
        } else if (vol >= CONFIG.thresholdLow) {
          targetState = "low";
          targetSrc = MOUTH_IMAGES.low;
          labelText = "الحالة: فم نصف مفتوح (مقاطع صوتية خفيفة)";
        }

        // 7. Dynamic <img> Src Swap with Debounce Timing
        const now = performance.now();
        const timeSinceLastChange = now - lastStateChangeTime;

        if (targetState !== currentMouthState && (timeSinceLastChange > CONFIG.holdTimeMs || targetState === "wide")) {
          currentMouthState = targetState;
          lastStateChangeTime = now;

          // Perform the actual src swap on the <img> tag
          avatarImg.src = targetSrc;
          stateLabel.textContent = labelText;
        }

        // 8. Subtle Avatar Head Bounce & Glow Pulse
        const isSpeaking = vol >= CONFIG.thresholdLow;
        const headScale = 1.0 + (isSpeaking ? Math.min(0.04, vol * 0.05) : 0);
        const glowScale = 1.0 + (isSpeaking ? Math.min(0.28, vol * 0.35) : 0);
        const glowOpacity = isSpeaking ? 0.65 + vol * 0.35 : 0.35;

        avatarFrame.style.transform = `scale(${headScale})`;
        avatarGlow.style.transform = `scale(${glowScale})`;
        avatarGlow.style.opacity = glowOpacity;

        if (isSpeaking) {
          avatarFrame.classList.add("speaking");
        } else {
          avatarFrame.classList.remove("speaking");
        }

        animationFrameId = requestAnimationFrame(loop);
      }

      animationFrameId = requestAnimationFrame(loop);
    }

    /* ==========================================================================
       USER INTERACTION: Live Microphone Input Testing
       ========================================================================== */
    btnMic.addEventListener("click", async () => {
      initAudioContext();

      if (!isListening) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              sampleRate: 16000,
              echoCancellation: true,
              noiseSuppression: true
            }
          });

          connectAudioSource(micStream);
          isListening = true;
          btnMic.textContent = "🛑 إيقاف الميكروفون";
          btnMic.style.background = "#e11d48";
        } catch (err) {
          alert("تعذر الوصول للميكروفون: " + err.message);
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        isListening = false;
        btnMic.textContent = "🎙️ تشغيل الميكروفون المباشر";
        btnMic.style.background = "#b82e24";
      }
    });

    /* ==========================================================================
       USER INTERACTION: Synthetic Speech (Web Speech API) Testing
       Simulates an AI Voice Assistant speaking in real-time.
       ========================================================================== */
    btnTestSpeech.addEventListener("click", () => {
      initAudioContext();

      // Test synthetic phrase in Saudi Arabic dialect
      const text = "يا هلا ومسهلا بك في الداهية، دليلك الذكي الشامل لمدينة القصب وموسم الملح.";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ar-SA";
      utterance.rate = 0.95;

      // Create an oscillator tone piped through the analyser to simulate live audio stream
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(220, audioContext.currentTime);

      osc.connect(gain);
      gain.connect(analyserNode);
      analyserNode.connect(audioContext.destination);

      if (!animationFrameId) startAnalysisLoop();

      utterance.onstart = () => {
        osc.start();
        // Vary gain amplitude to simulate speech cadence
        let step = 0;
        const interval = setInterval(() => {
          step++;
          gain.gain.value = Math.sin(step * 0.4) * 0.3 + 0.3;
          if (!window.speechSynthesis.speaking) {
            clearInterval(interval);
            try { osc.stop(); } catch (e) {}
          }
        }, 80);
      };

      utterance.onend = () => {
        try { osc.stop(); } catch (e) {}
      };

      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
